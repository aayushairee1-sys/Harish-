<script>
  // CONFIGURATION
  const SUPABASE_URL = 'https://ddmuzrmlpanlqsrpkeyc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_QE6adSsiKPskR7UEMeHTDw_Lh-UM9d-';
  const GEMINI_API_KEY = 'AQ.Ab8RN6LEvaGddzZykzCUXg-jDx3DmaOugXL51mLNRg0U7uB9RQ';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 🔒 PRIVATE PASSCODE LOCK
  const SECRET_PIN = "1234"; // Set your personal 4-digit PIN here

  window.onload = function() {
    const userPin = prompt("🔑 Enter PIN to open Digital Khata:");
    if (userPin !== SECRET_PIN) {
      document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:50px;'>Access Denied. Incorrect PIN.</h2>";
    } else {
      loadLedger();
    }
  };

  // 1. SPEECH SYNTHESIS (AI SPEAKS IN NEPALI)
  function speakNepali(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // Reset audio queue
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ne-NP';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  // 2. SPEECH RECOGNITION (LISTEN TO NEPALI VOICE)
  function startVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Voice input is not supported in this browser. Try Chrome or Safari.");
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'ne-NP';
    recognition.interimResults = false;

    speakNepali("हाजिरी, भन्नुहोस् के रेकर्ड गर्ने?");
    recognition.start();

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      document.getElementById('aiInput').value = transcript;
      processAIBill();
    };

    recognition.onerror = function(event) {
      alert("Voice input error: " + event.error);
    };
  }

  // 3. GET CURRENT CUSTOMER BALANCE FROM DATABASE
  async function getCurrentBalance(name) {
    const { data: bills } = await supabase.from('bills').select('amount, transaction_type').ilike('customer_name', name);
    if (!bills || bills.length === 0) return 0;

    return bills.reduce((total, bill) => {
      return bill.transaction_type === 'credit' ? total + bill.amount : total - bill.amount;
    }, 0);
  }

  // 4. ADD TRANSACTION & CALCULATE CUMULATIVE BALANCE
  async function addBill(type, prefilledData = null) {
    const category = prefilledData ? prefilledData.category : document.getElementById('category').value;
    const customer_name = prefilledData ? prefilledData.customer_name : document.getElementById('custName').value.trim();
    const customer_phone = prefilledData ? prefilledData.customer_phone : document.getElementById('custPhone').value.trim();
    const work_detail = prefilledData ? prefilledData.work_detail : document.getElementById('workDetail').value.trim();
    const amount = prefilledData ? prefilledData.amount : parseFloat(document.getElementById('amount').value);

    if (!customer_name || isNaN(amount) || amount <= 0) {
      alert("Please enter a valid Customer Name and Amount.");
      return;
    }

    // Get previous balance BEFORE inserting new bill
    const prevBalance = await getCurrentBalance(customer_name);

    // Insert transaction entry into database
    const { error } = await supabase.from('bills').insert([{
      customer_name,
      customer_phone,
      category,
      work_detail,
      amount,
      transaction_type: type
    }]);

    if (error) {
      alert("Database error: " + error.message);
    } else {
      // Calculate updated total balance
      const newTotal = type === 'credit' ? prevBalance + amount : prevBalance - amount;

      speakNepali(`${customer_name}को पुरानो खाता रु ${prevBalance} थियो। नयाँ कुल बाँकी रकम रु ${newTotal} भयो।`);

      // Clear manual form
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('workDetail').value = '';
      document.getElementById('amount').value = '';
      
      loadLedger();
    }
  }

  // 5. NEPALI AI AUTO-PARSER & CALCULATOR
  async function processAIBill() {
    const text = document.getElementById('aiInput').value.trim();
    if (!text) {
      alert("Please type or speak a transaction in Nepali.");
      return;
    }

    const prompt = `
    Extract transaction info from this Nepali sentence: "${text}"
    Operations: Rotavator (रोटाभेटर), Harrow (ह्यारो), Leveler, Cultivator, or transport materials like Stone (ढुङ्गा), Sand (बालुवा), Gravel (गिट्टी).

    Return ONLY raw JSON with these exact keys:
    {
      "customer_name": "string",
      "category": "Hardware" OR "Tractor - Fieldwork" OR "Tractor - Transport",
      "work_detail": "string detailing hours/trips/items",
      "amount": number,
      "transaction_type": "credit" OR "payment"
    }
    If transaction involves receiving money / clearing dues, use "payment", otherwise "credit".
    `;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await response.json();
      const rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const bill = JSON.parse(rawText);

      // Fetch existing balance to calculate preview of new total
      const currentDue = await getCurrentBalance(bill.customer_name);
      const updatedTotal = bill.transaction_type === 'credit' ? currentDue + bill.amount : currentDue - bill.amount;

      const confirmMsg = `गराउने: ${bill.customer_name}\nपुरानो बाकी: Rs. ${currentDue}\nनयाँ जोडिएको: Rs. ${bill.amount} (${bill.transaction_type})\n\nकुल नयाँ बाँकी रकम: Rs. ${updatedTotal}`;
      
      if (confirm(`AI Calculation Confirmation:\n\n${confirmMsg}`)) {
        await addBill(bill.transaction_type, bill);
        document.getElementById('aiInput').value = '';
      }
    } catch (err) {
      alert("AI Processing Error. Please check your Gemini API key.");
      console.error(err);
    }
  }

  // 6. RENDER LEDGER WITH AUTOMATIC CUMULATIVE BALANCE
  async function loadLedger() {
    const { data: bills, error } = await supabase.from('bills').select('*');
    const container = document.getElementById('ledgerList');
    
    if (error) {
      container.innerHTML = "<p style='color:red;'>Error loading ledger. Check SUPABASE_ANON_KEY.</p>";
      return;
    }

    if (!bills || bills.length === 0) {
      container.innerHTML = "<p style='color:#64748b;'>No ledger records found.</p>";
      return;
    }

    const customers = {};
    bills.forEach(bill => {
      const name = bill.customer_name;
      if (!customers[name]) {
        customers[name] = { balance: 0, phone: bill.customer_phone, breakdown: {} };
      }
      
      const val = bill.transaction_type === 'credit' ? bill.amount : -bill.amount;
      customers[name].balance += val;
      
      if (bill.customer_phone) customers[name].phone = bill.customer_phone;
      
      if (!customers[name].breakdown[bill.category]) {
        customers[name].breakdown[bill.category] = 0;
      }
      customers[name].breakdown[bill.category] += val;
    });

    container.innerHTML = '';
    for (let name in customers) {
      const cust = customers[name];

      let breakdownBadges = Object.keys(cust.breakdown)
        .map(cat => `<span class="badge ${cat.includes('Hardware') ? 'badge-hw' : 'badge-tr'}">${cat}: Rs. ${cust.breakdown[cat]}</span>`)
        .join(' ');

      const waText = encodeURIComponent(`Namaste ${name}, your current updated balance for Hardware/Tractor services is Rs. ${cust.balance}. Please clear your dues at your convenience.`);
      const waLink = cust.phone ? `https://wa.me/977${cust.phone}?text=${waText}` : '#';

      const div = document.createElement('div');
      div.className = 'customer-item';
      div.innerHTML = `
        <div>
          <strong>${name}</strong><br>
          <div style="margin: 4px 0;">${breakdownBadges}</div>
          <small style="color:${cust.balance > 0 ? '#d97706' : '#16a34a'}; font-size:14px; font-weight:bold;">
            ${cust.balance > 0 ? 'Total Outstanding Due: Rs. ' + cust.balance : 'Advance Balance: Rs. ' + Math.abs(cust.balance)}
          </small>
        </div>
        <div>
          ${cust.phone ? `<a href="${waLink}" target="_blank" class="wa-link">WhatsApp</a>` : ''}
        </div>
      `;
      container.appendChild(div);
    }
  }
</script>
